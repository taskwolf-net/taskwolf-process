name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Taskwolf dependencies
        run: bash .github/build-dependencies.sh "https://github.com/${{ github.repository_owner }}"
      - name: Build
        run: ./gradlew build
